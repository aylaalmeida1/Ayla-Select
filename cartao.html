<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clube VIP · Ayla Select</title>
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="tela" id="tela">

  <div class="cabecalho">
    <svg class="flourish" width="72" height="26" viewBox="0 0 72 26">
      <path d="M2 20 C 20 2, 34 2, 36 14 C 38 2, 52 2, 70 20"/>
    </svg>
    <div class="marca">
      Ayla Select
      <small>Clube VIP</small>
    </div>
  </div>

  <div id="conteudo">
    <div class="estado-vazio">
      <p>Carregando seu cartão…</p>
    </div>
  </div>

</div>

<template id="tpl-cartao">
  <div class="cartao-vip">
    <div class="linha-topo">
      <div id="avatar-slot"></div>
      <div>
        <div class="nome-cliente serif" data-campo="nome"></div>
        <span class="nivel-badge" data-campo="nivel"></span>
      </div>
    </div>

    <div class="progresso-wrap">
      <div class="progresso-legenda">
        <span>Visitas realizadas</span>
        <b data-campo="visitas-legenda"></b>
      </div>
      <div class="bracelete" data-campo="bracelete"></div>
      <div class="proxima-recompensa">
        Próxima recompensa em
        <div class="serif" data-campo="faltam"></div>
        <div data-campo="recompensa"></div>
      </div>
    </div>

    <div class="secao">
      <div class="secao-titulo">Benefícios VIP</div>
      <ul class="lista-beneficios" data-campo="beneficios"></ul>
    </div>

    <div class="secao">
      <div class="secao-titulo">Histórico de atendimentos</div>
      <div data-campo="historico"></div>
    </div>

    <div class="secao">
      <details class="cuidados">
        <summary>✦ Cuidados pós-procedimento</summary>
        <p data-campo="cuidados"></p>
      </details>
    </div>

    <div class="acoes">
      <a class="botao principal" data-campo="link-agendar" target="_blank">Agendar</a>
      <a class="botao secundario" data-campo="link-whatsapp" target="_blank">WhatsApp</a>
    </div>
  </div>

  <div class="rodape-marca">Ayla Select · Cartão exclusivo e intransferível</div>
</template>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/cartao.js"></script>
</body>
</html>
